<style>
/* Layout: sticky topbar (title + progress + tabs) over a single-column app; cards per reservation, editable timeline per day. */
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --bg:#FBFAF7; --surface:#FFFFFF; --surface-2:#F6F2EA;
  --ink:#241F17; --muted:#6E675B; --faint:#938B7C; --line:#E8E1D4;
  --accent:#B16A22; --accent-ink:#8A4F13; --accent-weak:#F4E8D7;
  --ok:#2F7D53; --ok-bg:#DCEEE2; --warn:#A9741A; --warn-bg:#F6E9CE; --info:#2F6AA0; --info-bg:#DCE9F3;
  --es:#C07A24; --uk:#3E7E6E; --fr:#4659A6;
  --shadow:0 1px 2px rgba(40,32,20,.05),0 6px 20px rgba(40,32,20,.06);
  --d:"Fraunces",Georgia,serif; --b:"DM Sans",system-ui,sans-serif; --m:"Space Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15120D; --surface:#1E1A13; --surface-2:#231E16;
  --ink:#F1EADD; --muted:#A79D8B; --faint:#857B6A; --line:#2E2719;
  --accent:#E09A52; --accent-ink:#E9B477; --accent-weak:#352817;
  --ok:#7CC79B; --ok-bg:#1E3328; --warn:#E0B566; --warn-bg:#352a14; --info:#7FB2DD; --info-bg:#182a3a;
  --es:#E0A85A; --uk:#6FB3A1; --fr:#8491D8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15120D; --surface:#1E1A13; --surface-2:#231E16;
  --ink:#F1EADD; --muted:#A79D8B; --faint:#857B6A; --line:#2E2719;
  --accent:#E09A52; --accent-ink:#E9B477; --accent-weak:#352817;
  --ok:#7CC79B; --ok-bg:#1E3328; --warn:#E0B566; --warn-bg:#352a14; --info:#7FB2DD; --info-bg:#182a3a;
  --es:#E0A85A; --uk:#6FB3A1; --fr:#8491D8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--b);line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
.wrap{width:100%;max-width:880px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--m)}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar{display:flex;align-items:center;gap:14px;padding-block:12px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand .k{font-family:var(--m);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-ink)}
.brand h1{font-family:var(--d);font-weight:600;font-size:21px;margin:1px 0 0;letter-spacing:-.01em;white-space:nowrap}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0}
.prog .lbl{font-size:12px;color:var(--muted);text-align:right;line-height:1.2}
.prog .lbl b{color:var(--ink);font-size:14px;font-family:var(--m)}
.ring{--p:0;width:42px;height:42px;border-radius:50%;flex-shrink:0;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;position:relative}
.ring::after{content:"";width:32px;height:32px;border-radius:50%;background:var(--surface)}
.ring span{position:absolute;font-size:11px;font-weight:700;font-family:var(--m);color:var(--ok)}
.sync{width:8px;height:8px;border-radius:50%;background:var(--faint);flex-shrink:0;align-self:flex-start;margin-top:2px}
.sync.on{background:var(--ok)}

.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font-family:var(--b);font-weight:600;font-size:14px;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.tab[aria-selected="true"]{background:var(--accent-weak);color:var(--accent-ink)}

main{padding-block:20px 70px}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2.sec{font-family:var(--d);font-weight:600;font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
.sub{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.muted{color:var(--muted)}

/* Resumen */
.ovgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.catcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.catcard .top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.catcard .ico{font-size:16px}
.catcard .nm{font-weight:600;font-size:14px}
.catcard .ct{margin-left:auto;font-family:var(--m);font-size:12px;color:var(--muted)}
.bar{height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:999px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:18px}
.panel h3{font-family:var(--d);font-weight:600;font-size:15px;margin:0 0 12px}
.falta{display:flex;flex-direction:column;gap:0}
.frow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--line);cursor:pointer}
.frow:first-child{border-top:0}
.frow .fi{font-size:14px;width:20px;text-align:center;flex-shrink:0}
.frow .ft{font-weight:500;font-size:14px;min-width:0}
.frow .ft small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.frow .fd{margin-left:auto;font-family:var(--m);font-size:11px;color:var(--muted);white-space:nowrap}
.dotpri{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.pri-alta{background:#c9522a}.pri-media{background:var(--warn)}.pri-baja{background:var(--faint)}
.moneyrow{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-top:1px dashed var(--line)}
.moneyrow:first-of-type{border-top:0}
.moneyrow .v{font-family:var(--m);font-weight:700}
.big{font-family:var(--d);font-size:26px;font-weight:600}

/* Reservas */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:var(--b);font-weight:600;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.item.s-confirmado{border-left:3px solid var(--ok)}
.item.s-reservado{border-left:3px solid var(--info)}
.item.s-pendiente{border-left:3px solid var(--warn)}
.ihead{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer}
.ihead .ico{font-size:17px;width:22px;text-align:center;flex-shrink:0}
.imid{min-width:0;flex:1}
.imid .t{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.imid .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.imid .meta .mono{color:var(--accent-ink)}
.pill{font-size:11px;font-weight:700;font-family:var(--b);padding:3px 9px;border-radius:999px;white-space:nowrap;flex-shrink:0;letter-spacing:.01em}
.pill.pendiente{background:var(--warn-bg);color:var(--warn)}
.pill.reservado{background:var(--info-bg);color:var(--info)}
.pill.confirmado{background:var(--ok-bg);color:var(--ok)}
.amt{font-family:var(--m);font-size:12.5px;color:var(--muted);flex-shrink:0;white-space:nowrap}
.chev{color:var(--faint);transition:transform .2s;flex-shrink:0}
.item.open .chev{transform:rotate(90deg)}
.detail{display:none;padding:2px 14px 15px;border-top:1px solid var(--line)}
.item.open .detail{display:block}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:13px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
.field label{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.field input,.field select,.field textarea{font-family:var(--b);font-size:14px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%}
.field input.mono{font-family:var(--m);font-size:13px}
.field textarea{resize:vertical;min-height:52px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.drow{display:flex;align-items:center;gap:14px;margin-top:13px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.del{appearance:none;border:1px solid var(--line);background:transparent;color:#c9522a;font-family:var(--b);font-weight:600;font-size:13px;padding:6px 12px;border-radius:9px;cursor:pointer}
.addbtn{appearance:none;width:100%;border:1.5px dashed var(--line);background:transparent;color:var(--accent-ink);font-family:var(--b);font-weight:600;font-size:14px;padding:13px;border-radius:14px;cursor:pointer;margin-top:12px}
.addbtn:hover{border-color:var(--accent);background:var(--accent-weak)}

/* Agenda */
.editbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.editbtn{appearance:none;border:1px solid var(--accent);background:var(--accent-weak);color:var(--accent-ink);font-family:var(--b);font-weight:600;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer}
.editbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.savehint{font-size:12px;color:var(--muted)}
.phase{margin-bottom:26px}
.ptag{font-family:var(--m);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.cityband{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:11px 14px;border-radius:12px 12px 0 0;color:#fff;margin-top:14px}
.cityband .cn{font-family:var(--d);font-weight:600;font-size:17px}
.cityband .ch{font-size:12.5px;opacity:.92}
.cb-es{background:var(--es)}.cb-uk{background:var(--uk)}.cb-fr{background:var(--fr)}
.cityblock{border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;overflow:hidden;background:var(--surface)}
.day{padding:14px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.dhead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.dday{font-family:var(--m);font-size:11px;font-weight:700;color:#fff;padding:3px 8px;border-radius:7px}
.dtitle{font-family:var(--d);font-weight:600;font-size:15.5px}
.dmove{margin-left:auto;font-size:11.5px;font-family:var(--m);color:var(--accent-ink);background:var(--accent-weak);padding:2px 8px;border-radius:7px}
/* stops read */
.stops{display:flex;flex-direction:column;margin:2px 0 0}
.move{display:flex;align-items:center;gap:7px;font-family:var(--m);font-size:11px;color:var(--muted);padding:2px 0 2px 3px}
.move .arr{color:var(--faint)}
.stopline{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
.stopdot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex-shrink:0}
.stoptime{font-family:var(--m);font-size:11px;font-weight:700;color:var(--accent-ink);min-width:42px;flex-shrink:0;margin-top:3px}
.stopbody{min-width:0}
.stopname{font-size:13.5px;font-weight:500;line-height:1.4}
.stopnote{font-size:12px;color:var(--muted);margin-top:1px}
.deat{font-size:13px;color:var(--muted);margin-top:9px}
.deat b{color:var(--accent-ink);font-weight:600;font-family:var(--m);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-right:6px}
.dtip{font-size:12.5px;color:var(--muted);margin-top:6px;padding-left:12px;border-left:2px solid var(--line)}
/* stops edit */
.di input{font-family:var(--b);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;color:var(--ink);font-size:14px}
.di .dt-title{font-family:var(--d);font-weight:600;font-size:15px;flex:1;min-width:120px}
.di .dt-move{font-family:var(--m);font-size:12px;max-width:190px}
.estop{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px;margin:7px 0;display:flex;flex-direction:column;gap:6px}
.estop .r{display:flex;gap:6px;align-items:center}
.estop input,.estop textarea{font-family:var(--b);font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%;color:var(--ink)}
.estop input.time{max-width:66px;font-family:var(--m);flex-shrink:0}
.estop input.mv{font-family:var(--m);font-size:12px;color:var(--muted)}
.estop input:focus,.estop textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.estop .ctrls{display:flex;gap:5px;margin-left:auto}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:13px;flex-shrink:0;line-height:1}
.iconbtn.rm{color:#c9522a}
.iconbtn:disabled{opacity:.3;cursor:default}
.addstop{appearance:none;border:1.5px dashed var(--line);background:transparent;color:var(--accent-ink);font-family:var(--b);font-weight:600;font-size:13px;padding:8px;border-radius:9px;cursor:pointer;width:100%;margin-top:4px}
.addstop:hover{border-color:var(--accent);background:var(--accent-weak)}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px}
</style>

function allItems(){

  const customs=Object.keys(ov).filter(id=>ov[id]&&ov[id]._custom).map(id=>Object.assign({id},ov[id]));
  return base.concat(customs);
}
function money(a,cur){
  if(a==null||a==="")return "";
  const n=Number(a); if(isNaN(n))return "";
  const sym={EUR:"€",USD:"US$",GBP:"£",ARS:"$"}[cur]||"";
  return (cur==="EUR"?sym:sym+" ")+n.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function stopsOf(dayId){
  const o=dov[dayId]||{};

  return (DAYINDEX[dayId].stops||[]).map((s,i)=>Object.assign({id:dayId+"-s"+i},s));
}

/* ---------- PERSIST (almacenamiento local del teléfono · offline) ---------- */
const LS_ITEMS="viaje2027_items", LS_DAYS="viaje2027_days";
function saveLS(){try{localStorage.setItem(LS_ITEMS,JSON.stringify(ov));localStorage.setItem(LS_DAYS,JSON.stringify(dov));$("#sync").classList.add("on");}catch(e){$("#sync").classList.remove("on");}}
function loadLS(){try{ov=JSON.parse(localStorage.getItem(LS_ITEMS)||"{}")||{};}catch(e){ov={};}try{dov=JSON.parse(localStorage.getItem(LS_DAYS)||"{}")||{};}catch(e){dov={};}}
function persistItem(id){saveLS();if(window.__sync){if(ov[id]===undefined)window.__sync.full(ov,dov);else window.__sync.item(id,ov[id]);}}
function persistDay(id){saveLS();if(window.__sync)window.__sync.day(id,dov[id]);}
function setItem(id,k,val){const cur=Object.assign({},ov[id]||{});cur[k]=val;ov[id]=cur;persistItem(id);}
function saveDay(id,patch){dov[id]=Object.assign({},dov[id]||{},patch);persistDay(id);}
/* Aplica cambios que llegan desde la nube (otro teléfono). No pisa si estás tipeando. */
window.__applyRemote=function(items,days){
  ov=items||{};dov=days||{};saveLS();
  const ae=document.activeElement;
  const editing=ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
  if(!editing)render();
};

/* ---------- EVENTS ---------- */
function switchView(v){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.view===v));
  ["resumen","agenda","reservas","gastos","tomy","paseos"].forEach(x=>$("#view-"+x).hidden=(x!==v));
  if(location.hash.slice(1)!==v)history.replaceState(null,"","#"+v);
  window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const tab=e.target.closest(".tab"); if(tab){switchView(tab.dataset.view);return;}
  const goto=e.target.closest("[data-goto]"); if(goto){switchView("reservas");setTimeout(()=>{const el=$(`.item[data-id="${goto.dataset.goto}"]`);if(el){el.classList.add("open");el.scrollIntoView({behavior:"smooth",block:"center"});}},60);return;}
  const chip=e.target.closest(".chip"); if(chip){if(chip.dataset.fs!==undefined){filterStat=chip.dataset.fs;}else{filterCat=chip.dataset.f;}renderReservas();return;}
  if(e.target.id==="editAgendaBtn"){editAgenda=!editAgenda;renderAgenda();return;}
  const add=e.target.closest("[data-addstop]"); if(add){const id=add.dataset.addstop;const s=stopsOf(id);s.push({id:uid(),time:"",name:"",note:"",move:""});saveDay(id,{stops:s});renderAgenda();return;}
  const dstop=e.target.closest("[data-delstop]"); if(dstop){const id=dstop.dataset.day;const s=stopsOf(id).filter(x=>x.id!==dstop.dataset.stop);saveDay(id,{stops:s});renderAgenda();return;}
  const up=e.target.closest("[data-up]"); if(up){moveStop(up.dataset.day,up.dataset.stop,-1);return;}
  const dn=e.target.closest("[data-down]"); if(dn){moveStop(dn.dataset.day,dn.dataset.stop,1);return;}
  const tog=e.target.closest("[data-toggle]"); if(tog){tog.closest(".item").classList.toggle("open");return;}
  const del=e.target.closest("[data-del]"); if(del){const id=del.closest(".item").dataset.id;delete ov[id];render();persistItem(id);return;}
  if(e.target.id==="addbtn"){openAdd();return;}
});
function moveStop(id,sid,dir){const s=stopsOf(id);const i=s.findIndex(x=>x.id===sid);const j=i+dir;if(i<0||j<0||j>=s.length)return;const t=s[i];s[i]=s[j];s[j]=t;saveDay(id,{stops:s});renderAgenda();}

document.addEventListener("change",e=>{
  if(e.target.closest("#view-agenda")){
    const el=e.target, id=el.dataset.day; if(!id)return;
    if(el.dataset.stop){const s=stopsOf(id);const t=s.find(x=>x.id===el.dataset.stop);if(t){t[el.dataset.k]=el.value;saveDay(id,{stops:s});}}
    else{saveDay(id,{[el.dataset.k]:el.value});}
    return;
  }
  const f=e.target.closest("[data-k]"); if(!f)return;
  const item=e.target.closest(".item"); if(!item)return;
  const id=item.dataset.id, k=f.dataset.k;
  let val=f.type==="checkbox"?f.checked:f.value;
  if(k==="amount")val=val===""?null:(parseFloat(String(val).replace(",","."))||null);
  setItem(id,k,val);
  if(["status","shared","saldado","amount","loc"].includes(k))render();
});

function openAdd(){
  const cats=Object.keys(CATS).map(k=>`<option value="${k}">${CATS[k].nm}</option>`).join("");
  const wrap=document.createElement("div"); wrap.className="item open"; wrap.style.marginTop="12px";
  wrap.innerHTML=`<div class="detail" style="display:block;border-top:0;padding-top:14px"><div class="fields">
    <div class="field"><label>Categoría</label><select id="na-cat">${cats}</select></div>
    <div class="field"><label>Fecha</label><input id="na-date" placeholder="p. ej. 24 ene"></div>
    <div class="field full"><label>Título</label><input id="na-title" placeholder="Qué es la reserva"></div>
    <div class="field"><label>Quiénes</label><input id="na-who" placeholder="Los 4"></div>
    <div class="field"><label>Monto</label><input id="na-amount" class="mono" inputmode="decimal" placeholder="0.00"></div>
    <div class="field full"><label>Notas</label><textarea id="na-notes" placeholder="Opcional"></textarea></div>
  </div><div class="drow"><label class="chk"><input type="checkbox" id="na-shared"> Compartido con los Waserman</label>
    <button class="del" id="na-cancel" style="color:var(--muted)">Cancelar</button>
    <button class="addbtn" id="na-save" style="width:auto;margin:0;padding:8px 18px;border-style:solid;border-color:var(--accent);background:var(--accent-weak)">Guardar</button></div></div>`;
  $("#addbtn").replaceWith(wrap);
  $("#na-cancel").onclick=()=>renderReservas();
  $("#na-save").onclick=()=>{
    const title=$("#na-title").value.trim(); if(!title){$("#na-title").focus();return;}
    const id="c"+Date.now(); const amt=$("#na-amount").value.trim();
    ov[id]={_custom:true,cat:$("#na-cat").value,title,date:$("#na-date").value.trim()||"s/f",sort:"2027-12-31",who:$("#na-who").value.trim()||"—",status:"pendiente",loc:"",amount:amt===""?null:(parseFloat(amt.replace(",","."))||null),cur:"EUR",pri:"media",notes:$("#na-notes").value.trim(),shared:$("#na-shared").checked};
    persistItem(id); render();
  };
}

/* ---------- INIT ---------- */
function init(){
  loadLS();
  dbReady=true;$("#sync").classList.add("on");
  render();
  const hv=location.hash.slice(1);
  if(["resumen","agenda","reservas","gastos","tomy","paseos"].includes(hv))switchView(hv);
  window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(["resumen","agenda","reservas","gastos","tomy","paseos"].includes(v))switchView(v);});
  // Service worker: permite usar la app sin internet (ideal en el viaje).
  if("serviceWorker" in navigator){
    let refreshing=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(refreshing)return;refreshing=true;location.reload();});
    window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").then(reg=>{if(reg&&reg.update)reg.update();}).catch(()=>{});});
    // Al volver al frente, busca si hay versión nueva (y se recarga sola vía controllerchange).
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)navigator.serviceWorker.getRegistration().then(r=>{if(r&&r.update)r.update();}).catch(()=>{});});
  }
}
if(document.readyState!=="loading")init();else window.addEventListener("DOMContentLoaded",init);
</script>

import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    window.__sync = {
